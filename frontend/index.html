<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tax Co-Pilot">
<title>Tax & Cash Co-Pilot</title>
<meta name="description" content="See what you owe, what you can safely invest, and when to pay advance tax.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="v3.css">
</head>
<body>
<div class="login" id="login" hidden><div class="login-card" id="loginCard"></div></div>

<div class="app" hidden>
  <aside class="sidebar" aria-label="Main">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#fff" fill-opacity=".14"/><path d="M9 21l5-6 4 4 5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Tax &amp; Cash</b><span>Co-Pilot</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <span class="live-pill" id="livePill" data-state="off" role="status"><i></i><span>Offline</span></span>
      <button class="ghost-light" id="demoBtn" type="button">Load demo data</button>
      <button class="ghost-light" id="signOutBtn" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="offline" id="offline" hidden>
      <span>Can't reach the server. Start it with <code>python run.py</code> in the backend folder.</span>
      <button type="button" id="retryBtn">Try again</button>
    </div>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <p id="pageSub"></p>
      </div>
      <button class="btn primary" id="addBtn" type="button" aria-label="Add transaction">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="lbl-long">Add transaction</span>
      </button>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="moreSheet" role="dialog" aria-label="All sections" hidden></div>
<aside class="drawer" id="drawer" aria-label="Transaction details" hidden></aside>
<dialog id="addDlg" class="dlg" aria-labelledby="addTitle"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="monthly.js"></script>
<script src="accuracy.js"></script>
<script src="app.js"></script>
<script src="account.js"></script>
</body>
</html>
